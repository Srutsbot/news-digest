<title>Sjoernalistieke Bot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a broadcast rundown. Time runs down a mono column on the left, the story sits beside it. */
:root {
  --paper: #f6f1e7; --sheet: #fcf9f2; --ink: #1c1a17; --muted: #665f54; --line: #ddd4c3;
  --accent: #8f1d21; --accent-soft: #f1e0da; --signal: #a32a1f; --signal-soft: #f5e3dc;
  --good: #3a6335; --good-soft: #e4ecd9;
  --display: "Times New Roman", Times, serif;
  --body: "Times New Roman", Times, serif;
  --mono: "Times New Roman", Times, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #171412; --sheet: #211d1a; --ink: #f1ebdf; --muted: #aca294; --line: #3a332c;
    --accent: #e39a93; --accent-soft: #43211f; --signal: #ef8f7f; --signal-soft: #3f221d;
    --good: #9cc48e; --good-soft: #26331f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #171412; --sheet: #211d1a; --ink: #f1ebdf; --muted: #aca294; --line: #3a332c;
  --accent: #e39a93; --accent-soft: #43211f; --signal: #ef8f7f; --signal-soft: #3f221d;
  --good: #9cc48e; --good-soft: #26331f;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16.5px/1.5 var(--body);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--sheet);
}
a { color: inherit; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* masthead */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--sheet); border-bottom: 1px solid var(--line);
}
.bar-in { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px 20px; padding-top: 12px; }
.bar-actions { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 9px; font: 800 20.9px/1 var(--display); letter-spacing: -.02em; }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft); }
.tabs { grid-column: 1 / -1; display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
.tab {
  border: 0; border-bottom: 3px solid transparent; background: none; padding: 9px 0 7px; cursor: pointer;
  font-weight: 600; color: var(--muted); white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { font: 500 13.2px var(--mono); margin-left: 3px; }
#tab-agenda { margin-left: auto; }
#tab-speakers { align-self: center; margin-block: 4px; padding: 4px 12px; border: 2px solid var(--accent); border-radius: 6px; color: var(--accent); }
#tab-speakers:hover { background: var(--accent-soft); }
#tab-speakers[aria-selected="true"] { background: var(--accent); color: var(--sheet); }
.search { justify-self: end; width: 100%; max-width: 340px; }
.search input {
  width: 100%; padding: 7px 10px; background: var(--paper);
  border: 1px solid var(--line); border-radius: 6px;
}

/* opening */
.open { padding-block: 20px 22px; display: grid; gap: 12px; }
.open-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.open-card { margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--accent); color: var(--sheet); border-radius: 8px; padding: 18px 20px; }
.open-kicker { align-self: flex-start; padding: 2px 8px; border-radius: 4px; background: var(--sheet); color: var(--accent); font-size: 13.5px; font-weight: 700; letter-spacing: .03em; }
.open-title { margin: 0; font: 700 clamp(24px, 2.6vw, 30px)/1.15 var(--display); text-wrap: balance; }
.open-title a { text-decoration: none; }
.open-title a:hover { text-decoration: underline; text-underline-offset: 3px; }
.open-greeting { margin: -6px 0 0; font-size: 17px; }
.open-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.open-stat { display: grid; gap: 2px; padding: 9px 10px; border: 2px solid transparent; border-radius: 6px; background: var(--sheet); color: var(--ink); text-align: left; cursor: pointer; }
.open-stat:hover { border-color: var(--ink); }
.open-stat b { font: 700 28px/1 var(--display); color: var(--accent); }
.open-stat span { font-size: 15px; line-height: 1.2; }
.open-stat.gap b { color: #5b2a86; }
.open-stat.gap:hover { border-color: #5b2a86; }
.open-next { margin: 0; font-size: 16.5px; line-height: 1.35; }
.open-text { margin: 0; font-size: 17px; line-height: 1.4; }
.open-more { align-self: flex-start; margin-top: auto; font-size: 16.5px; font-weight: 700; text-underline-offset: 3px; }
@media (max-width: 760px) { .open-grid { grid-template-columns: minmax(0, 1fr); } }
.tally { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font: 400 14.3px var(--mono); }
.tally b { color: var(--ink); font-weight: 500; }
.stale { padding: 9px 12px; background: var(--signal-soft); color: var(--ink); border-radius: 6px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; padding-bottom: 56px; align-items: start; }
.rail { display: grid; gap: 28px; }
.eyebrow {
  margin: 0 0 10px; font: 500 13.2px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.eyebrow.hot { color: var(--signal); }
section + section { margin-top: 32px; }

/* rundown rows */
.rundown { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; }
.row { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 4px 14px; padding: 15px 16px; }
.row + .row { border-top: 1px solid var(--line); }
.row.repeat { box-shadow: inset 3px 0 0 var(--signal); }
.seen { margin-top: 10px; padding: 8px 10px; background: var(--signal-soft); border-radius: 6px; font-size: 14.3px; }
.seen-h, .seen summary { font-weight: 600; }
.seen summary { cursor: pointer; }
.seen ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.seen li { overflow-wrap: anywhere; }
.seen .when { font: 400 13.2px var(--mono); color: var(--muted); margin-right: 6px; }
.seen a { text-underline-offset: 2px; }
.slug { font: 500 13.2px/1.75 var(--mono); color: var(--muted); }
.head { margin: 0; font: 700 20.9px/1.2 var(--display); letter-spacing: -.012em; text-wrap: pretty; }
.head.sm { font-size: 18.2px; }
.head a { text-decoration: none; }
.head a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.orig { margin: 4px 0 0; color: var(--muted); font-size: 14.3px; overflow-wrap: anywhere; }
.snip { margin: 5px 0 0; color: var(--muted); font-size: 15.4px; max-width: 65ch; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 9px; font-size: 14.3px; color: var(--muted); }
.meta a { color: var(--accent); text-underline-offset: 2px; }
.src { font-weight: 600; color: var(--ink); }
.chip {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  font: 500 12.7px/1.6 var(--mono); background: var(--paper); color: var(--muted);
}
.chip.new { background: var(--accent-soft); color: var(--accent); }
.chip.hot { background: var(--signal-soft); color: var(--signal); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.gap { background: #5b2a86; color: #ffffff; }
.act {
  border: 1px solid var(--line); background: var(--sheet); border-radius: 5px; padding: 2px 9px;
  font-size: 14.3px; font-weight: 600; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-block;
}
.act:hover { border-color: var(--accent); color: var(--accent); }
.act.on { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.act.quiet { border-color: transparent; background: none; color: var(--muted); font-weight: 500; }
.act:disabled { opacity: .65; cursor: wait; }
.act:disabled:hover { border-color: var(--line); color: var(--ink); }
.refresh { padding: 7px 12px; border-radius: 6px; white-space: nowrap; }
#refresh { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
#refresh:hover { background: var(--signal); border-color: var(--signal); color: var(--sheet); }
#refresh:disabled, #refresh:disabled:hover { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
#bnr-toggle.on, #bnr-toggle.on:hover { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* must-read stories: the full width of the page, three per row */
.must { margin-bottom: 32px; }
.must-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.must-card { display: flex; flex-direction: column; gap: 4px; background: var(--sheet); border: 1px solid var(--line); border-top: 3px solid var(--signal); border-radius: 8px; padding: 14px 15px; min-width: 0; }
.must-card .acts { margin-top: auto; padding-top: 10px; }
@media (max-width: 880px) { .must-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .must-grid { grid-template-columns: minmax(0, 1fr); } }

/* agenda: today and tomorrow side by side, grouped by theme, with a date search above */
.agenda-search { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 15px; margin-bottom: 24px; }
.agenda-fields { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.agenda-fields label { display: grid; gap: 4px; font-size: 14.3px; color: var(--muted); }
.agenda-fields input { padding: 6px 9px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
.agenda-table-wrap { overflow-x: auto; margin-top: 14px; }
.agenda-table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 15px; }
.agenda-table th { text-align: left; font-size: 13.2px; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
.agenda-table td { padding: 8px 10px 8px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
.agenda-table .nowrap { white-space: nowrap; }
.agenda-days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; margin-bottom: 24px; }
.agenda-day { margin: 0; background: var(--sheet); border: 1px solid var(--line); border-top: 3px solid var(--signal); border-radius: 8px; padding: 14px 15px; min-width: 0; }
.agenda-day h2 { margin: 0 0 2px; font: 700 22px/1.2 var(--display); }
.agenda-day .when-long { color: var(--muted); font-size: 14.3px; }
.theme-group { margin-top: 15px; }
.theme-name { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 4px; background: var(--accent); color: var(--sheet); font: 700 15.4px var(--display); cursor: pointer; list-style: none; }
.theme-name::-webkit-details-marker { display: none; }
.theme-name .label::before { content: "▸"; display: inline-block; width: 1em; }
.theme-group[open] .theme-name { margin-bottom: 7px; }
.theme-group[open] .theme-name .label::before { content: "▾"; }
.theme-tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--accent); color: var(--sheet); font-weight: 700; font-size: 13.2px; white-space: nowrap; }
.agenda-item { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 2px 8px; padding: 5px 0; }
.agenda-item + .agenda-item { border-top: 1px solid var(--line); }
.agenda-item .clock { color: var(--muted); font-size: 14.3px; line-height: 1.5; }
.agenda-item a { font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
.agenda-item a:hover { color: var(--accent); text-decoration: underline; }
.agenda-item small { display: block; color: var(--muted); font-size: 13.8px; }
@media (max-width: 760px) { .agenda-days { grid-template-columns: minmax(0, 1fr); } }

/* speakers: large and page-filling, with the form as the main event */
.speakers { padding: 8px 0 56px; }
.speakers-hero { font: 800 clamp(28px, 3.6vw, 40px)/1.08 var(--display); letter-spacing: -.01em; margin: 0 0 4px; }
.speakers-hero em { font-style: italic; color: var(--accent); }
.speakers-lead { font-size: 18px; line-height: 1.35; color: var(--muted); margin: 0 0 18px; max-width: 42em; }
.speakers-grid { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.speakers-form { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 8px; padding: 20px; display: grid; gap: 16px; }
.speaker-step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-size: 19px; font-weight: 700; color: var(--ink); align-items: baseline; }
.speaker-step .num { grid-row: span 3; font: 800 32px/1 var(--display); color: var(--accent); }
.speaker-step .hint { font-size: 16px; font-weight: 400; color: var(--muted); }
.speaker-step textarea, .speaker-step input { width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 17.5px; line-height: 1.35; font-weight: 400; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
.speaker-step textarea { resize: vertical; }
.speaker-formats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.speaker-formats .term { font-size: 15.5px; font-weight: 400; padding: 3px 9px; }
#speaker-subject { min-height: 110px; }
#speaker-angle { min-height: 80px; }
.speaker-go { width: 100%; padding: 12px 18px; border: 0; border-radius: 6px; background: var(--accent); color: var(--sheet); font: 700 20px var(--display); cursor: pointer; }
.speaker-go:hover { background: var(--signal); }
.speaker-copy { justify-self: center; background: none; border: 0; color: var(--accent); font-size: 16px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.speakers-side { background: var(--accent); color: var(--sheet); border-radius: 8px; padding: 18px; }
.speakers-side h3 { margin: 0 0 12px; font: 700 21px/1.15 var(--display); }
.speakers-side ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 16.5px; line-height: 1.25; }
.speakers-side li { display: grid; grid-template-columns: 20px minmax(0, 1fr); }
.speakers-side li::before { content: "✓"; font-weight: 700; }
.speakers-warning { margin: 14px 0 0; padding-top: 10px; border-top: 1px solid currentColor; font-size: 14.5px; line-height: 1.3; }
.speaker-prompt { margin-top: 18px; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
.speaker-prompt summary { cursor: pointer; font: 700 17px var(--display); }
.speaker-prompt .copybox { min-height: 300px; font-size: 15.5px; line-height: 1.35; }
@media (max-width: 880px) { .speakers-grid { grid-template-columns: minmax(0, 1fr); } }

/* coverage meter: one tick per outlet, Dutch and international split */
.cover { display: flex; gap: 2px; align-items: center; margin-top: 11px; flex-wrap: wrap; }
.tick { width: 14px; height: 9px; border-radius: 2px; background: var(--line); }
.tick.on { background: var(--signal); }
.tick.sep { margin-left: 7px; }
.cover span.lbl { margin-left: 9px; font: 400 13.2px var(--mono); color: var(--muted); }

/* outlets */
.outlets { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.outlet { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 13px 15px; display: flex; flex-direction: column; gap: 11px; }
.outlet h3 { margin: 0; font: 500 13.2px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.story { display: grid; gap: 4px; }
.story a { font: 500 16px/1.3 var(--body); text-decoration: none; overflow-wrap: anywhere; }
.story a:hover { color: var(--accent); text-decoration: underline; }
.story .acts { margin-top: 2px; align-items: center; }
.story.repeat { padding-left: 9px; box-shadow: inset 3px 0 0 var(--signal); }
.story .seen { margin-top: 4px; padding: 5px 8px; font-size: 14.3px; }

/* side rail */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 15px; }
.wek a { font: 700 17.6px/1.25 var(--display); text-decoration: none; }
.wek a:hover { color: var(--accent); }
.terms { display: flex; flex-wrap: wrap; gap: 5px; }
.term { border: 1px solid var(--line); background: var(--sheet); border-radius: 4px; padding: 2px 7px; font: 400 13.8px var(--mono); cursor: pointer; }
.term:hover { border-color: var(--accent); }
.term[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.term i { font-style: normal; opacity: .65; margin-left: 3px; }
.list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.list a { text-decoration: none; font-weight: 500; }
.list a:hover { color: var(--accent); text-decoration: underline; }
.list small { display: block; color: var(--muted); font-size: 13.8px; }
.note { font-size: 13.8px; color: var(--muted); margin: 10px 0 0; }

/* research filters and source table */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 13px; }
.switch { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; font-size: 14.9px; color: var(--muted); cursor: pointer; }
.switch input { accent-color: var(--accent); }
.day { padding: 8px 16px; background: var(--paper); font: 500 13.2px var(--mono); color: var(--muted); border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; border-radius: 8px 8px 0 0; }
.day + .row { border-top: 1px solid var(--line); }
.src-table { width: 100%; border-collapse: collapse; font-size: 14.3px; }
.src-table caption { text-align: left; }
.src-table th { text-align: left; font: 500 12.1px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 0 4px; }
.src-table td { padding: 3px 0; vertical-align: top; }
.src-table td:last-child { text-align: right; white-space: nowrap; font: 400 13.2px var(--mono); color: var(--muted); }
.src-table .bad { color: var(--signal); }

/* shortlist */
.pitch { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; }
.pitches { display: grid; gap: 12px; }
.pitch-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
.pitch label { font-size: 13.8px; color: var(--muted); display: grid; gap: 4px; }
.pitch textarea { width: 100%; min-height: 76px; padding: 8px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; resize: vertical; color: var(--ink); }
.pitch select { padding: 3px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; }
.empty { background: var(--sheet); border: 1px dashed var(--line); border-radius: 8px; padding: 26px 20px; }
.empty h2 { margin: 0 0 6px; font: 700 22px var(--display); }
.empty p { margin: 0; color: var(--muted); max-width: 55ch; }
.copybox { width: 100%; min-height: 160px; margin-top: 12px; padding: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; font: 400 14.3px var(--mono); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--ink); color: var(--paper); padding: 7px 14px; border-radius: 6px; font-size: 14.9px;
}
.foot { padding-block: 0 40px; color: var(--muted); font-size: 13.8px; max-width: 80ch; }

@media (max-width: 880px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .bar-in { grid-template-columns: minmax(0, 1fr) auto; }
  .search { grid-column: 1 / -1; grid-row: 2; max-width: none; justify-self: stretch; }
}
@media (max-width: 480px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .tabs { gap: 16px; }
}
</style>

<header class="bar"><div class="wrap bar-in">
  <div class="brand"><span class="lamp" aria-hidden="true"></span>Sjoernalistieke Bot</div>
  <div class="search"><input id="q" type="search" placeholder="Zoek in koppen en bronnen" aria-label="Zoek in koppen en bronnen"></div>
  <div class="bar-actions">
    <button class="act refresh" id="bnr-toggle" type="button" aria-pressed="false" title="Aan: toon BNR-labels en gebruik BNR in de sprekersprompt">BNR-actief</button>
    <button class="act refresh" id="refresh" type="button">Ververs</button>
  </div>
  <div class="tabs" role="tablist" aria-label="Onderdelen">
    <button class="tab" role="tab" id="tab-news" data-view="news">Actualiteit</button>
    <button class="tab" role="tab" id="tab-research" data-view="research">Onderzoek</button>
    <button class="tab" role="tab" id="tab-science" data-view="science">Wetenschap</button>
    <button class="tab" role="tab" id="tab-agenda" data-view="agenda">Agenda</button>
    <button class="tab" role="tab" id="tab-ideas" data-view="ideas">Leeslijst<span class="n" id="idea-count"></span></button>
    <button class="tab" role="tab" id="tab-speakers" data-view="speakers">Sprekers</button>
  </div>
</div></header>

<main class="wrap">
  <div class="open" id="open"></div>
  <div id="view"></div>
</main>
<footer class="wrap foot" id="foot"></footer>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const DATA = /*__DATA__*/null;

/* ---------- storage: stays in this browser only ---------- */
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } },
};
const IDEAS_KEY = "vd.ideas", VISIT_KEY = "vd.visit", PREV_KEY = "vd.previous";
const STATUSES = ["Idee", "Uitzoeken", "Voorgesteld", "Afgevallen"];
let ideas = store.get(IDEAS_KEY, []);
if (!Array.isArray(ideas)) ideas = [];

const nowMs = Date.now();
const lastVisit = store.get(VISIT_KEY, 0);
if (nowMs - lastVisit > 3600000) {            /* an hour apart counts as a new visit */
  if (lastVisit) store.set(PREV_KEY, lastVisit);
  store.set(VISIT_KEY, nowMs);
}
const previousVisit = store.get(PREV_KEY, 0);
const newSince = previousVisit || nowMs - 86400000;

/* ---------- helpers ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function safe(url) { return /^https?:\/\//i.test(url || "") ? url : "#"; }
function ext(url, text, cls) { return h("a", { href: safe(url), target: "_blank", rel: "noopener noreferrer", class: cls }, text); }

const TZ = "Europe/Amsterdam";
const fmt = (opts) => new Intl.DateTimeFormat("nl-NL", { timeZone: TZ, ...opts });
const dayKey = (d) => fmt({ year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
function shortTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (dayKey(d) === dayKey(new Date())) return fmt({ hour: "2-digit", minute: "2-digit" }).format(d);
  return fmt({ day: "numeric", month: "short" }).format(d);
}
function dayLabel(iso) {
  if (!iso) return "Zonder datum";
  const d = new Date(iso);
  if (dayKey(d) === dayKey(new Date())) return "Vandaag";
  if (dayKey(d) === dayKey(new Date(Date.now() - 86400000))) return "Gisteren";
  return fmt({ weekday: "long", day: "numeric", month: "long" }).format(d);
}
const isNew = (iso) => !!iso && new Date(iso).getTime() > newSince;
const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/* ---------- state ---------- */
const VIEWS = ["news", "research", "science", "agenda", "ideas", "speakers"];
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "news";
let query = "", term = null, region = null, showGeneral = false;
const BNR_KEY = "vd.bnrActive";
let bnrActive = store.get(BNR_KEY, false) === true;   /* off by default: remembered per browser */
const expanded = new Set();

const OUTLETS = DATA.news.outlets, PLATFORMS = DATA.research.platforms, ITEMS = DATA.research.items;
const SCIENCE = DATA.science || { items: [], scanned: 0, maxAgeDays: 2, sourcesTotal: 0, sourcesUsed: 0 };
const AGENDA = DATA.agenda || { from: "", to: "", events: [], sources: [] };
const FIRST_FOREIGN = OUTLETS.findIndex((o) => o.name.startsWith("The Guardian"));
const matches = (...parts) => !query || parts.some((p) => norm(p).includes(query));

/* ---------- shortlist ---------- */
const hasIdea = (link) => ideas.some((i) => i.link === link);
function saveIdeas() {
  if (!store.set(IDEAS_KEY, ideas)) toast("Opslaan lukt niet in deze browser. Je selectie blijft staan tot je de pagina sluit.");
  document.getElementById("idea-count").textContent = ideas.length ? " " + ideas.length : "";
}
function toggleIdea(a, button) {
  if (hasIdea(a.link)) {
    ideas = ideas.filter((i) => i.link !== a.link);
    toast("Verwijderd uit je leeslijst");
  } else {
    ideas.unshift({ link: a.link, title: a.titleNl || a.title, original: a.titleNl ? a.title : "", source: a.source, language: a.language || "", published: a.published || null, status: "Idee", note: "" });
    toast("Bewaard in je leeslijst");
  }
  saveIdeas();
  if (button) { const on = hasIdea(a.link); button.classList.toggle("on", on); button.textContent = on ? "Bewaard" : "Bewaar"; button.setAttribute("aria-pressed", on); }
}
function saveButton(a) {
  const on = hasIdea(a.link);
  const b = h("button", { class: "act" + (on ? " on" : ""), "aria-pressed": on ? "true" : "false", type: "button" }, on ? "Bewaard" : "Bewaar");
  b.addEventListener("click", () => toggleIdea(a, b));
  return b;
}
function translateLink(a) {
  if (a.titleNl || /^(NL|EN|NL\/EN)$/.test(a.language || "")) return null;
  return ext("https://translate.google.com/?sl=auto&tl=nl&op=translate&text=" + encodeURIComponent(a.title), "Vertaal kop", "act quiet");
}
function pitchText(i) {
  const lines = [i.title];
  if (i.original) lines.push(`Originele kop (machinevertaling hierboven): ${i.original}`);
  lines.push(`Bron: ${i.source}${i.language ? " (" + i.language + ")" : ""}`, i.link);
  if (i.note) lines.push("", i.note);
  return lines.join("\n");
}

let toastTimer;
function toast(text, ms = 2400) {
  const el = document.getElementById("toast");
  el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

/* ---------- refresh: starts the GitHub workflow and reloads once the new edition is live ---------- */
const REFRESH_TOKEN_KEY = "vd.refreshToken";   /* stays in this browser, never in the page source */
const DISPATCH_URL = "https://api.github.com/repos/srutsbot/news-digest/actions/workflows/redactie.yml/dispatches";
const REFRESH_POLL_MS = 10000, REFRESH_TIMEOUT_MS = 300000;

async function waitForNewEdition() {
  const started = Date.now();
  while (Date.now() - started < REFRESH_TIMEOUT_MS) {
    await new Promise((done) => setTimeout(done, REFRESH_POLL_MS));
    try {
      const resp = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
      const found = (await resp.text()).match(/"generated":\s*"([^"]+)"/);
      if (found && new Date(found[1]) > new Date(DATA.generated)) return true;
    } catch (e) { /* a failed check is not fatal, the next one may work */ }
  }
  return false;
}

async function refreshPage() {
  const button = document.getElementById("refresh");
  const token = store.get(REFRESH_TOKEN_KEY, "") || (prompt("Plak je GitHub-token om te verversen. Het blijft alleen in deze browser staan.") || "").trim();
  if (!token) return;
  const reset = (message) => { button.disabled = false; button.textContent = "Ververs"; toast(message, 7000); };
  button.disabled = true;
  button.textContent = "Starten…";
  let resp;
  try {
    resp = await fetch(DISPATCH_URL, {
      method: "POST",
      headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ ref: "main" }),
    });
  } catch (e) {
    return reset("GitHub is niet bereikbaar. Probeer het zo nog eens.");
  }
  if ([401, 403, 404].includes(resp.status)) {
    store.set(REFRESH_TOKEN_KEY, "");
    return reset("GitHub accepteert dit token niet. Klik opnieuw op Ververs en plak een geldig token.");
  }
  if (!resp.ok) return reset(`Verversen is niet gestart (GitHub-status ${resp.status}). Probeer het zo nog eens.`);
  store.set(REFRESH_TOKEN_KEY, token);
  button.textContent = "Bezig met ophalen…";
  if (await waitForNewEdition()) location.reload();
  else reset("Dit duurt langer dan normaal. Kijk later nog eens, of bekijk de run in de Actions-tab van GitHub.");
}

/* ---------- views ---------- */
function greeting() {
  const hour = Number(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", hourCycle: "h23" }).format(new Date()));
  return hour < 6 ? "Goedenacht" : hour < 12 ? "Goedemorgen" : hour < 18 ? "Goedemiddag" : "Goedenavond";
}

function goTo(target, selector) {
  view = target;
  try { history.replaceState(null, "", "#" + view); } catch (e) {}
  renderView();
  const place = selector && document.querySelector(selector);
  if (place) place.scrollIntoView({ block: "start" });
  else window.scrollTo(0, 0);
  if (place) window.scrollBy(0, -document.querySelector(".bar").offsetHeight - 10);
}

function dayOpening() {
  const today = isoDay(new Date());
  const clock = fmt({ hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date());
  const planned = AGENDA.events.filter((e) => e.date === today);
  const next = planned.find((e) => e.time && e.time >= clock && themeIsOpen(e.theme));
  const purple = new Set([...DATA.news.onmisbaar, ...OUTLETS.flatMap((o) => o.articles)].filter((a) => a.notInDutch).map((a) => a.title)).size;
  const stories = DATA.news.onmisbaar.length;
  const stat = (number, label, onclick, cls) => h("button", { class: "open-stat" + (cls ? " " + cls : ""), type: "button", onclick }, h("b", null, number), h("span", null, label));
  const date = fmt({ weekday: "long", day: "numeric", month: "long" }).format(new Date());
  return h("section", { class: "open-card" },
    h("div", { class: "open-kicker" }, "Sjoernalistieke Bot"),
    h("h1", { class: "open-title" }, date.charAt(0).toUpperCase() + date.slice(1)),
    h("p", { class: "open-greeting" }, `${greeting()}. Dit staat er vandaag klaar:`),
    h("div", { class: "open-stats" },
      stat(stories, stories === 1 ? "onmisbaar verhaal" : "onmisbare verhalen", () => goTo("news", ".must")),
      stat(planned.length, planned.length === 1 ? "punt op de agenda" : "punten op de agenda", () => goTo("agenda")),
      stat(purple, "mogelijk nog niet in NL", () => goTo("news", ".chip.gap"), "gap")),
    next && h("p", { class: "open-next" }, h("b", null, `Volgende om ${next.time}: `), `${next.title} (${next.source})`));
}

function wekdienstCard() {
  const w = DATA.news.wekdienst;
  return h("section", { class: "open-card nos" },
    h("div", { class: "open-kicker" }, "NOS Wekdienst"),
    w ? h("h2", { class: "open-title" }, ext(w.link, w.title)) : h("h2", { class: "open-title" }, "Nog niet verschenen"),
    w && w.snippet ? h("p", { class: "open-text" }, w.snippet)
      : !w && h("p", { class: "open-text" }, "De Wekdienst van vandaag is nog niet gevonden. De NOS publiceert hem in de ochtend."),
    ext(w ? w.link : "https://nos.nl/nieuws/laatste", w ? "Lees de Wekdienst bij de NOS →" : "Naar het laatste nieuws bij de NOS →", "open-more"));
}

function renderOpen() {
  const generated = new Date(DATA.generated);
  const okO = OUTLETS.filter((o) => o.ok).length, okP = PLATFORMS.filter((p) => p.ok).length;
  const fresh = OUTLETS.flatMap((o) => o.articles).concat(ITEMS).filter((a) => isNew(a.published)).length;
  const hours = (Date.now() - generated) / 3600000;
  document.getElementById("open").replaceChildren(...[
    h("div", { class: "open-grid" }, dayOpening(), wekdienstCard()),
    h("div", { class: "tally" },
      h("span", null, "opgehaald ", h("b", null, fmt({ hour: "2-digit", minute: "2-digit" }).format(generated))),
      h("span", null, h("b", null, fresh), previousVisit ? " nieuw sinds je vorige bezoek" : " van de laatste 24 uur"),
      h("span", null, h("b", null, `${okO}/${OUTLETS.length}`), " media"),
      h("span", null, h("b", null, `${okP}/${PLATFORMS.length}`), " onderzoeksplatforms")),
    hours > 14 && h("div", { class: "stale" }, `Deze editie is ${Math.round(hours)} uur oud. Controleer of de GitHub-workflow nog draait.`),
  ].filter(Boolean));
}

function coverage(members) {
  const have = new Set(members.map((m) => m.source));
  return h("div", { class: "cover", role: "img", "aria-label": `${have.size} van ${OUTLETS.length} media` },
    OUTLETS.map((o, i) => h("span", { class: "tick" + (have.has(o.name) ? " on" : "") + (i === FIRST_FOREIGN ? " sep" : ""), title: o.name })),
    h("span", { class: "lbl" }, `${have.size} van ${OUTLETS.length} media`));
}

function notInDutchChip(entry) {
  return entry.notInDutch && h("span", { class: "chip gap", title: "Automatische controle op Nederlandse koppen en Google News Nederland. Controleer dit zelf." }, "Mogelijk nog niet in NL");
}

function renderNews() {
  const stories = DATA.news.onmisbaar.filter((s) => !term && matches(s.title, ...s.members.map((m) => m.source + " " + m.title)));
  const must = !term && stories.length > 0 && h("section", { class: "must" },
    h("h2", { class: "eyebrow hot" }, "Onmisbaar"),
    h("div", { class: "must-grid" }, stories.map((s) => {
      const inBnr = s.members.some((m) => m.source === "BNR");
      const first = s.members[0];
      return h("article", { class: "must-card" },
        h("div", { class: "slug" }, String(s.members.length) + " media"),
        h("h3", { class: "head" }, s.title),
        coverage(s.members),
        h("div", { class: "meta" },
          bnrActive && h("span", { class: "chip" + (inBnr ? " ok" : "") }, inBnr ? "Staat bij BNR" : "Niet in BNR-koppen"),
          notInDutchChip(s),
          s.members.map((m) => ext(m.link, m.source))),
        h("div", { class: "acts" }, saveButton({ link: first.link, title: s.title, source: first.source })));
    })));

  const main = [];
  const cards =OUTLETS.map((o) => {
    let list = o.articles;
    if (term) list = list.filter((a) => a.terms.includes(term));
    list = list.filter((a) => matches(a.title, a.snippet, o.name));
    return { o, list };
  }).filter(({ o, list }) => list.length || (!o.ok && !term && !query));

  main.push(h("section", null,
    h("h2", { class: "eyebrow" }, term ? `Koppen met “${term}”` : "Bij de redacties"),
    cards.length ? h("div", { class: "outlets" }, cards.map(({ o, list }) => {
      const open = expanded.has(o.name) || term || query;
      const shown = open ? list : list.slice(0, 3);
      const canCollapse = expanded.has(o.name) && !term && !query && list.length > 3;
      return h("article", { class: "outlet" },
        h("h3", null, h("span", null, o.name), !o.ok && h("span", { class: "chip hot" }, "niet bereikt")),
        !o.ok && h("p", { class: "snip" }, "Deze bron gaf geen koppen terug."),
        shown.map((a) => h("div", { class: "story" + (a.repeat ? " repeat" : "") },
          ext(a.link, a.title),
          a.repeat && h("details", { class: "seen" },
            h("summary", null, `Ook bij ${[...new Set(a.repeat.mentions.map((m) => m.source))].slice(0, 2).join(", ")}${new Set(a.repeat.mentions.map((m) => m.source)).size > 2 ? " e.a." : ""}${a.repeat.days > 1 ? ` · ${a.repeat.days} dagen` : ""}`),
            mentionList(a.repeat.mentions)),
          h("div", { class: "acts" },
            a.published && h("span", { class: "mono chip" + (isNew(a.published) ? " new" : "") }, shortTime(a.published)),
            notInDutchChip(a),
            saveButton({ ...a, source: o.name })))),
        !open && list.length > 3 && h("button", { class: "act quiet", type: "button", onclick: () => { expanded.add(o.name); renderView(); } }, `Toon ${list.length - 3} meer`),
        canCollapse && h("button", { class: "act quiet", type: "button", onclick: () => { expanded.delete(o.name); renderView(); } }, `Toon ${list.length - 3} minder`));
    })) : h("p", { class: "snip" }, "Niets gevonden. Pas je zoekopdracht aan."),
  ));

  const rail = [
    DATA.news.trending.length && h("section", null, h("h2", { class: "eyebrow" }, "Veelgenoemd"),
      h("div", { class: "terms" }, DATA.news.trending.slice(0, 24).map((t) =>
        h("button", { class: "term", type: "button", "aria-pressed": term === t.term ? "true" : "false",
          onclick: () => { term = term === t.term ? null : t.term; renderView(); } }, t.term, h("i", null, t.outlets)))),
      h("p", { class: "note" }, "Het getal is het aantal media met dit woord in een kop. Klik om te filteren.")),
    DATA.news.opinion.length && h("section", null, h("h2", { class: "eyebrow" }, "Opinie"),
      h("ul", { class: "list" }, DATA.news.opinion.map((a) => h("li", null, ext(a.link, a.title), h("small", null, a.source))))),
  ];
  return h("div", null, must, h("div", { class: "grid" }, h("div", null, main), h("aside", { class: "rail" }, rail)));
}

function renderResearch() {
  const hiddenGeneral = ITEMS.filter((a) => a.general).length;
  const list = ITEMS.filter((a) => (showGeneral || !a.general) && (!region || a.region === region)
    && matches(a.title, a.titleNl, a.snippet, a.source, a.region));
  const regions = [...new Set(PLATFORMS.map((p) => p.region))];

  const groups = [];
  for (const a of list) {
    const label = dayLabel(a.published);
    if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
    groups[groups.length - 1].items.push(a);
  }

  const rows = groups.flatMap((g) => [
    h("div", { class: "day" }, g.label.charAt(0).toUpperCase() + g.label.slice(1)),
    g.items.map((a) => h("article", { class: "row" },
      h("div", { class: "slug" }, a.language),
      h("div", null,
        h("h3", { class: "head sm", dir: "auto" }, ext(a.link, a.titleNl || a.title)),
        a.titleNl && h("p", { class: "orig", dir: "auto" }, a.title),
        a.snippet && h("p", { class: "snip", dir: "auto" }, a.snippet),
        h("div", { class: "meta" },
          h("span", { class: "src" }, a.source),
          isNew(a.published) && h("span", { class: "chip new" }, "nieuw"),
          a.story !== null && a.story !== undefined && h("span", { class: "chip hot" }, "Mogelijk meerdere platforms"),
          a.general && h("span", { class: "chip" }, "algemene feed"),
          a.echoes.length > 0 && h("span", { class: "chip ok", title: "Twee of meer gedeelde woorden met koppen van: " + a.echoes.join(", ") },
            "Mogelijk ook bij " + a.echoes.slice(0, 2).join(", ") + (a.echoes.length > 2 ? ` +${a.echoes.length - 2}` : ""))),
        h("div", { class: "acts" }, saveButton(a), translateLink(a))))),
  ]);

  const table = regions.map((r) => {
    const members = PLATFORMS.filter((p) => p.region === r);
    return [h("tr", null, h("th", { colspan: "2", scope: "colgroup" }, r)),
      members.map((p) => h("tr", null,
        h("td", { class: p.ok ? "" : "bad" }, p.name, p.general ? " *" : ""),
        h("td", { class: p.ok ? "" : "bad" }, p.ok ? p.count : "niet bereikt")))];
  });
  const quiet = PLATFORMS.filter((p) => p.ok && !p.count).length;

  return h("div", { class: "grid" },
    h("section", null,
      h("h2", { class: "eyebrow" }, `Onderzoek van de laatste ${DATA.research.maxAgeDays} dagen`),
      h("div", { class: "filters" },
        h("button", { class: "term", type: "button", "aria-pressed": !region ? "true" : "false", onclick: () => { region = null; renderView(); } }, "Alle regio's"),
        regions.map((r) => h("button", { class: "term", type: "button", "aria-pressed": region === r ? "true" : "false", onclick: () => { region = r; renderView(); } }, r))),
      h("label", { class: "switch" },
        h("input", { id: "general", type: "checkbox", checked: showGeneral, onchange: (e) => { showGeneral = e.target.checked; renderView(); } }),
        `Toon ook bronnen met vooral dagelijks nieuws (${hiddenGeneral} koppen)`),
      rows.length ? h("div", { class: "rundown" }, rows) : h("p", { class: "snip" }, "Niets gevonden. Kies een andere regio of pas je zoekopdracht aan.")),
    h("aside", { class: "rail" },
      h("section", null, h("h2", { class: "eyebrow" }, "Bronnen vandaag"),
        h("div", { class: "card" },
          h("table", { class: "src-table" }, h("tbody", null, table)),
          h("p", { class: "note" }, `Het getal is het aantal koppen op deze pagina. ${quiet ? quiet + " bereikte platforms publiceerden niets in deze periode. " : ""}* Vooral dagelijks nieuws, standaard verborgen.`)))));
}

function mentionList(items) {
  return h("ul", null, items.map((m) => h("li", null,
    h("span", { class: "when" }, shortTime(m.published)),
    h("span", { class: "src" }, m.source), ": ",
    ext(m.link, m.title))));
}

function renderScience() {
  const list =SCIENCE.items.filter((a) => matches(a.title, a.snippet, a.source, a.reasons.join(" ")));
  const groups = [];
  for (const a of list) {
    const label = dayLabel(a.published);
    if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
    groups[groups.length - 1].items.push(a);
  }
  const rows = groups.flatMap((g) => [
    h("div", { class: "day" }, g.label.charAt(0).toUpperCase() + g.label.slice(1)),
    g.items.map((a) => h("article", { class: "row" + (a.repeat || a.terms.length ? " repeat" : "") },
      h("div", { class: "slug" }, fmt({ hour: "2-digit", minute: "2-digit" }).format(new Date(a.published))),
      h("div", null,
        h("h3", { class: "head sm" }, ext(a.link, a.title)),
        a.snippet && h("p", { class: "snip" }, a.snippet),
        h("div", { class: "meta" },
          h("span", { class: "src" }, a.source),
          a.language !== "NL" && h("span", { class: "chip" }, a.language),
          a.reasons.map((r) => h("span", { class: "chip" }, r)),
          isNew(a.published) && h("span", { class: "chip new" }, "nieuw"),
          a.echoes.length > 0 && h("span", { class: "chip ok", title: "Twee of meer gedeelde woorden met koppen van: " + a.echoes.join(", ") },
            "Mogelijk ook bij " + a.echoes.slice(0, 2).join(", ") + (a.echoes.length > 2 ? ` +${a.echoes.length - 2}` : ""))),
        a.repeat && h("div", { class: "seen" },
          h("div", { class: "seen-h" }, `Mogelijk hetzelfde verhaal, ook hier genoemd (${a.repeat.count}× in ${a.repeat.days} ${a.repeat.days === 1 ? "dag" : "dagen"}):`),
          mentionList(a.repeat.mentions)),
        a.terms.map((t) => h("details", { class: "seen" },
          h("summary", null, `“${t.term}” staat in nog ${t.count} ${t.count === 1 ? "kop" : "koppen"} (${t.sources} bronnen, ${t.days} dagen)`),
          mentionList(t.mentions),
          t.count > t.mentions.length && h("p", { class: "note", style: "margin:6px 0 0" }, `De ${t.mentions.length} nieuwste staan hier.`))),
        h("div", { class: "acts" }, saveButton(a), translateLink(a))))),
  ]);
  return h("div", { class: "grid" },
    h("section", null,
      h("h2", { class: "eyebrow" }, "Wetenschap"),
      rows.length ? h("div", { class: "rundown" }, rows) : h("p", { class: "snip" }, "Niets gevonden. Pas je zoekopdracht aan.")),
    h("aside", { class: "rail" },
      h("section", null, h("h2", { class: "eyebrow" }, "Zo is dit gekozen"),
        h("div", { class: "card" },
          h("p", { class: "note", style: "margin:0" }, `${SCIENCE.items.length} van de ${SCIENCE.scanned} koppen van de laatste ${SCIENCE.maxAgeDays} dagen, uit ${SCIENCE.sourcesUsed} van de ${SCIENCE.sourcesTotal} bronnen. Maximaal 2 koppen per bron, het nieuwste staat bovenaan.`),
          h("p", { class: "note" }, "De keuze is een automatische vergelijking van woorden, geen redactioneel oordeel en geen meting van wat luisteraars horen. De labels tonen waarom een kop is gekozen. Lees het artikel voordat je het voorstelt."),
          h("p", { class: "note" }, "Een rode streep betekent dat het verhaal of een woord uit de kop vaker voorkomt in de bronnen van de laatste 5 dagen. Ook dit is een woordvergelijking, en Nederlandse en Engelse koppen worden meestal niet aan elkaar gekoppeld.")))));
}

/* ---------- agenda ---------- */
const isoDay = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const noonOf = (day) => new Date(day + "T12:00:00Z");
const longDay = (day) => fmt({ weekday: "long", day: "numeric", month: "long" }).format(noonOf(day));
const shortDay = (day) => fmt({ weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(noonOf(day));
const eventMatches = (e) => matches(e.title, e.detail, e.source, e.theme);
let agendaFrom = "", agendaTo = "";
/* These themes are rarely needed: they start closed and sit at the bottom of a day, in this order. */
const THEMES_AT_BOTTOM = ["Themadag", "Economie en geld"];
const THEMES_CLOSED_FIRST = new Set(["Economie en geld"]);
const THEME_STATE_KEY = "vd.agendaThemes";
let themeState = store.get(THEME_STATE_KEY, {});
if (!themeState || typeof themeState !== "object") themeState = {};
const themeIsOpen = (theme) => theme in themeState ? !!themeState[theme] : !THEMES_CLOSED_FIRST.has(theme);

function agendaColumn(label, day) {
  const events = AGENDA.events.filter((e) => e.date === day && eventMatches(e));
  const countOf = (theme) => events.filter((e) => e.theme === theme).length;
  const themes = [...new Set(events.map((e) => e.theme))].sort((a, b) =>
    THEMES_AT_BOTTOM.indexOf(a) - THEMES_AT_BOTTOM.indexOf(b) || countOf(b) - countOf(a) || a.localeCompare(b, "nl"));
  return h("section", { class: "agenda-day" },
    h("h2", null, label),
    h("div", { class: "when-long" }, longDay(day)),
    themes.length ? themes.map((theme) => {
      const inTheme = events.filter((e) => e.theme === theme);
      return h("details", { class: "theme-group", open: themeIsOpen(theme),
          ontoggle: (ev) => { if (themeIsOpen(theme) !== ev.target.open) { themeState[theme] = ev.target.open; store.set(THEME_STATE_KEY, themeState); renderOpen(); } } },
        h("summary", { class: "theme-name" }, h("span", { class: "label" }, theme), h("span", null, inTheme.length)),
        inTheme.map((e) => h("div", { class: "agenda-item" },
          h("span", { class: "clock" }, e.time || "–"),
          h("div", null, ext(e.link, e.title), h("small", null, [e.source, e.detail].filter(Boolean).join(" · "))))));
    }) : h("p", { class: "snip" }, "Geen agendapunten gevonden."));
}

function agendaResults() {
  if (!agendaFrom) return [h("p", { class: "note" }, "Kies een dag, of een begin- en einddatum voor een hele periode.")];
  const [first, last] = [agendaFrom, agendaTo || agendaFrom].sort();
  const found = AGENDA.events.filter((e) => e.date >= first && e.date <= last && eventMatches(e));
  const outside = first < AGENDA.from || last > AGENDA.to;
  return [
    h("p", { class: "note" }, `${found.length} ${found.length === 1 ? "agendapunt" : "agendapunten"} gevonden.`),
    outside && h("p", { class: "note" }, `Let op: de agenda bevat alleen ${shortDay(AGENDA.from)} t/m ${shortDay(AGENDA.to)}. Buiten die periode is niets te vinden.`),
    found.length > 0 && h("div", { class: "agenda-table-wrap" }, h("table", { class: "agenda-table" },
      h("thead", null, h("tr", null, ["Datum", "Tijd", "Thema", "Wat", "Bron"].map((c) => h("th", { scope: "col" }, c)))),
      h("tbody", null, found.map((e) => h("tr", null,
        h("td", { class: "nowrap" }, shortDay(e.date)),
        h("td", { class: "nowrap" }, e.time || "–"),
        h("td", null, h("span", { class: "theme-tag" }, e.theme)),
        h("td", null, ext(e.link, e.title), e.detail && h("small", { style: "display:block;color:var(--muted)" }, e.detail)),
        h("td", { class: "nowrap" }, e.source)))))),
  ].filter(Boolean);
}

function renderAgenda() {
  const today = isoDay(new Date());
  const tomorrow = isoDay(new Date(noonOf(today).getTime() + 86400000));
  const results = h("div", { id: "agenda-results" }, agendaResults());
  const refreshResults = () => results.replaceChildren(...agendaResults());
  const dateField = (id, label, value, set) => h("label", { for: id }, label,
    h("input", { id, type: "date", value, min: AGENDA.from, max: AGENDA.to, onchange: (e) => { set(e.target.value); refreshResults(); } }));
  const failed = AGENDA.sources.filter((s) => !s.ok).map((s) => s.name);
  return h("div", { style: "padding-bottom:56px" },
    h("section", { class: "agenda-search" },
      h("h2", { class: "eyebrow" }, "Zoek op datum"),
      h("div", { class: "agenda-fields" },
        dateField("agenda-from", "Van", agendaFrom, (v) => { agendaFrom = v; }),
        dateField("agenda-to", "Tot en met (mag leeg)", agendaTo, (v) => { agendaTo = v; })),
      results),
    h("div", { class: "agenda-days" }, agendaColumn("Vandaag", today), agendaColumn("Morgen", tomorrow)),
    h("p", { class: "note" }, "Bronnen: " + AGENDA.sources.map((s) => s.ok ? `${s.name} (${s.count})` : `${s.name} (niet bereikt)`).join(", ") + ". Het thema is automatisch toegekend op basis van woorden en kan afwijken. Controleer tijden bij de bron."),
    failed.length > 0 && h("p", { class: "stale" }, "Deze bronnen ontbreken nu: " + failed.join(", ") + "."),
    h("p", { class: "note" }, "Bedrijfscijfers, zaken bij Nederlandse rechtbanken en persconferenties staan hier nog niet in."));
}

/* ---------- speakers: builds a research prompt here, the search itself happens at Perplexity ---------- */
const PERPLEXITY_URL = "https://www.perplexity.ai/";
const MAX_PREFILLED_URL = 4000;    /* longer prompts are too long for a link, so those are pasted by hand */
let speakerSubject = "", speakerAngle = "", speakerFormat = "";
const SPEAKER_FORMATS = ["Live radio-interview", "Vooropgenomen radio-item", "Tv-talkshow", "Tv-reportage", "Podcast", "Debat", "Geschreven interview", "Achtergrondgesprek"];

function speakerPrompt(subject, angle, format) {
  return [
    (bnrActive ? "Je bent researcher bij BNR Nieuwsradio." : "Je bent researcher voor een Nederlandse journalist.") + " Zoek minstens 5 Nederlandse sprekers die we voor radio of tv kunnen benaderen over het onderwerp hieronder.",
    "",
    `Onderwerp, artikel of link:\n${subject}`,
    angle ? `\nOnze insteek:\n${angle}` : "\nOnze insteek: niet opgegeven. Bepaal wat de nieuwswaardige kern is en vermeld die bovenaan.",
    format ? `\nHet format:\n${format}\nKies sprekers die bij dit format passen. Leg per persoon kort uit waarom die daar geschikt voor is, of waar het risico zit.` : "",
    "",
    "Eisen:",
    "1. Alleen mensen die in het Nederlands het gesprek kunnen voeren en in Nederland werken of daar sterk aan verbonden zijn.",
    "2. Geef voorrang aan mensen met aantoonbare radio- of tv-ervaring. Noem per persoon een concreet optreden met programma en datum, of schrijf \"geen optreden gevonden\".",
    "3. Kijk wat elke persoon recent over dit onderwerp heeft geschreven of gezegd, bij voorkeur uit de laatste 24 maanden. Noem per persoon minstens één publicatie, opiniestuk of interview met titel en datum.",
    "4. Leg per persoon in één zin uit wat die kan toevoegen aan onze insteek, en welk standpunt die inneemt als dat uit de bronnen blijkt.",
    "5. Noem huidige functie en werkgever, en belangen die een rol kunnen spelen, zoals een politieke functie, opdrachtgever of lobby.",
    "6. Zoek variatie in invalshoek, en vermeld als alle gevonden sprekers dezelfde kant op wijzen.",
    "",
    "Betrouwbaarheid:",
    "- Geef bij elk feit een bronlink. Wat je niet kunt onderbouwen, laat je weg. Verzin geen namen, functies, optredens of publicaties.",
    "- Controleer of de persoon nog in deze functie werkt en nog leeft, en meld het als dat onduidelijk is.",
    "- Is een opgegeven link niet leesbaar, bijvoorbeeld door een betaalmuur, zeg dat dan en werk alleen met wat wel vaststaat.",
    "- Vind je minder dan 5 geschikte mensen, zeg dat dan eerlijk in plaats van de lijst aan te vullen.",
    "- Zoek per persoon actief naar telefoonnummer en e-mailadres, en anders naar de persvoorlichting of werkpagina. Geef bij elk gegeven de bronlink. Verzin of raad nooit een nummer of adres, schrijf dan \"niet gevonden\".",
    "",
    "Geef het resultaat als tabel met deze kolommen, de best passende spreker bovenaan: naam | functie en werkgever | waarom geschikt voor onze insteek | radio- of tv-ervaring | recente publicatie | belangen | telefoon en e-mail | bronnen.",
    "Sluit af met twee kritische vragen die we elke spreker kunnen stellen.",
  ].join("\n");
}

function renderSpeakers() {
  const preview = h("textarea", { class: "copybox", id: "speaker-prompt", "aria-label": "De prompt voor Perplexity", readonly: true });
  const refreshPreview = () => { preview.value = speakerSubject.trim() ? speakerPrompt(speakerSubject.trim(), speakerAngle.trim(), speakerFormat.trim()) : ""; };
  refreshPreview();
  const promptBox = h("details", { class: "speaker-prompt" }, h("summary", null, "Bekijk de prompt"), preview);
  const copyPrompt = () => {
    const done = navigator.clipboard ? navigator.clipboard.writeText(preview.value) : Promise.reject();
    return done.catch(() => { promptBox.open = true; preview.focus(); preview.select(); throw new Error("copy blocked"); });
  };
  const search = () => {
    if (!preview.value) { toast("Vul eerst een artikel of onderwerp in."); return; }
    const encoded = encodeURIComponent(preview.value);
    const prefilled = encoded.length <= MAX_PREFILLED_URL;
    const copied = copyPrompt();     /* started first, because the new tab takes the focus away from this page */
    window.open(prefilled ? `${PERPLEXITY_URL}search?q=${encoded}` : PERPLEXITY_URL, "_blank", "noopener");
    copied.then(() => toast(prefilled ? "Perplexity geopend. De prompt staat ook op je klembord." : "Lange prompt gekopieerd. Plak hem in Perplexity met Cmd+V.", 7000),
      () => toast("Kopiëren werd geblokkeerd. Selecteer de prompt hieronder.", 7000));
  };
  const copyOnly = () => {
    if (!preview.value) { toast("Vul eerst een artikel of onderwerp in."); return; }
    copyPrompt().then(() => toast("Prompt gekopieerd"), () => toast("Kopiëren werd geblokkeerd. Selecteer de prompt hieronder.", 7000));
  };
  const formatInput = h("input", { id: "speaker-format", type: "text", placeholder: "Bijvoorbeeld: live radio-interview van 8 minuten", value: speakerFormat,
    oninput: (e) => { speakerFormat = e.target.value; refreshPreview(); markFormat(); } });
  const formatChoices = SPEAKER_FORMATS.map((f) => h("button", { class: "term", type: "button", "aria-pressed": speakerFormat === f ? "true" : "false",
    onclick: () => { speakerFormat = speakerFormat === f ? "" : f; formatInput.value = speakerFormat; refreshPreview(); markFormat(); } }, f));
  const markFormat = () => formatChoices.forEach((b, i) => b.setAttribute("aria-pressed", speakerFormat === SPEAKER_FORMATS[i] ? "true" : "false"));
  const promises = ["Minstens 5 Nederlandse sprekers", "Radio- en tv-ervaring eerst", "Wat ze recent schreven of zeiden", "Belangen en standpunten in beeld", "Een bronlink bij elk feit", "Telefoonnummer en e-mailadres"];
  return h("section", { class: "speakers" },
    h("h2", { class: "speakers-hero" }, "Wie bel je ", h("em", null, "hierover?")),
    h("p", { class: "speakers-lead" }, "Gooi je artikel erin, vertel je insteek en krijg een lijst met sprekers die je kunt benaderen."),
    h("div", { class: "speakers-grid" },
      h("div", { class: "speakers-form" },
        h("label", { class: "speaker-step", for: "speaker-subject" },
          h("span", { class: "num", "aria-hidden": "true" }, "1"),
          h("span", null, "Je artikel of onderwerp"),
          h("span", { class: "hint" }, "Plak een link, de tekst of één onderwerp."),
          h("textarea", { id: "speaker-subject", placeholder: "Bijvoorbeeld: Servië", value: speakerSubject, oninput: (e) => { speakerSubject = e.target.value; refreshPreview(); } })),
        h("label", { class: "speaker-step", for: "speaker-angle" },
          h("span", { class: "num", "aria-hidden": "true" }, "2"),
          h("span", null, "Jouw insteek"),
          h("span", { class: "hint" }, "Wat wil je precies weten of laten zien?"),
          h("textarea", { id: "speaker-angle", placeholder: "Bijvoorbeeld: wat betekenen de protesten voor de toetreding tot de EU?", value: speakerAngle, oninput: (e) => { speakerAngle = e.target.value; refreshPreview(); } })),
        h("div", { class: "speaker-step" },
          h("span", { class: "num", "aria-hidden": "true" }, "3"),
          h("label", { for: "speaker-format" }, "Wat is het format?"),
          h("span", { class: "hint" }, "Kies er een of omschrijf het zelf."),
          h("div", null, formatInput, h("div", { class: "speaker-formats" }, formatChoices))),
        h("button", { class: "speaker-go", type: "button", onclick: search }, "Zoek mijn sprekers →"),
        h("button", { class: "speaker-copy", type: "button", onclick: copyOnly }, "Alleen de prompt kopiëren")),
      h("aside", { class: "speakers-side" },
        h("h3", null, "Dit vraagt de bot altijd"),
        h("ul", null, promises.map((p) => h("li", null, h("span", null, p)))),
        h("p", { class: "speakers-warning" }, "Perplexity doet de zoekopdracht en kan fouten maken. Controleer elke naam en bron. Plak geen vertrouwelijke informatie, want wat je invult gaat naar Perplexity."))),
    promptBox);
}

function renderIdeas() {
  if (!ideas.length) {
    return h("div", { class: "empty" },
      h("h2", null, "Je leeslijst is nog leeg"),
      h("p", null, "Klik bij een kop op Bewaar. Hier houd je per verhaal je status en aantekeningen bij, en kopieer je het als voorstel voor de redactie."));
  }
  const list = ideas.filter((i) => matches(i.title, i.source, i.note));
  const box = h("div", { id: "copy-slot" });
  const copy = async () => {
    const text = list.filter((i) => i.status !== "Afgevallen").map(pitchText).join("\n\n---\n\n");
    try { await navigator.clipboard.writeText(text); toast("Gekopieerd"); }
    catch (e) {
      const area = h("textarea", { class: "copybox", id: "copy-text", "aria-label": "Tekst om te kopiëren", readonly: true });
      area.value = text; box.replaceChildren(area); area.focus(); area.select();
      toast("Kopiëren werd geblokkeerd. Selecteer de tekst hieronder.");
    }
  };
  return h("section", { style: "padding-bottom:56px" },
    h("div", { class: "pitch-top", style: "margin-bottom:12px" },
      h("h2", { class: "eyebrow", style: "margin:0" }, "Leeslijst"),
      h("button", { class: "act", type: "button", onclick: copy }, "Kopieer als voorstel")),
    box,
    h("p", { class: "note", style: "margin:0 0 12px" }, "Je selectie en aantekeningen staan alleen in deze browser. Ze gaan niet mee naar GitHub of een ander apparaat."),
    h("div", { class: "pitches" }, list.map((i, n) => h("article", { class: "pitch" },
      h("div", { class: "pitch-top" },
        h("span", { class: "src" }, i.source, i.language ? " · " + i.language : ""),
        h("select", { id: "status-" + n, "aria-label": "Status", onchange: (e) => { i.status = e.target.value; saveIdeas(); } },
          STATUSES.map((s) => { const o = h("option", { value: s }, s); o.selected = s === i.status; return o; }))),
      h("h3", { class: "head sm" }, ext(i.link, i.title)),
      i.original && h("p", { class: "orig", dir: "auto" }, i.original),
      h("label", null, "Aantekeningen: invalshoek, bronnen, Nederlandse haak",
        h("textarea", { id: "note-" + n, value: i.note, oninput: (e) => { i.note = e.target.value; saveIdeas(); } })),
      h("div", { class: "acts" },
        h("button", { class: "act quiet", type: "button", onclick: () => { ideas = ideas.filter((x) => x !== i); saveIdeas(); renderView(); } }, "Verwijder"))))));
}

function renderView() {
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.view === view ? "true" : "false");
  document.getElementById("open").style.display = view === "news" ? "" : "none";   /* the opening belongs to the news tab */
  const content = view === "news" ? renderNews() : view === "research" ? renderResearch() : view === "science" ? renderScience() : view === "agenda" ? renderAgenda() : view === "speakers" ? renderSpeakers() : renderIdeas();
  document.getElementById("view").replaceChildren(content);
}

/* ---------- wiring ---------- */
for (const t of document.querySelectorAll(".tab")) {
  t.addEventListener("click", () => {
    view = t.dataset.view;
    try { history.replaceState(null, "", "#" + view); } catch (e) {}
    renderView();
    window.scrollTo(0, 0);
  });
}
document.getElementById("refresh").addEventListener("click", refreshPage);
document.getElementById("q").addEventListener("input", (e) => { query = norm(e.target.value.trim()); renderView(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("q").focus(); }
});
function renderBnrState() {
  const button = document.getElementById("bnr-toggle");
  button.classList.toggle("on", bnrActive);
  button.setAttribute("aria-pressed", bnrActive ? "true" : "false");
  document.getElementById("foot").textContent =
    `Koppen linken naar de originele artikelen; sommige zitten achter een betaalmuur. ${bnrActive ? "“Niet in BNR-koppen”, " : ""}“Mogelijk ook bij” en “Mogelijk meerdere platforms” zijn automatische vergelijkingen van woorden in de opgehaalde koppen. Controleer ze voordat je erop afgaat. Anderstalige koppen zijn automatisch vertaald met MyMemory en kunnen fouten bevatten; de originele kop staat eronder.`;
}
document.getElementById("bnr-toggle").addEventListener("click", () => {
  bnrActive = !bnrActive;
  store.set(BNR_KEY, bnrActive);
  renderBnrState();
  renderView();
});
renderBnrState();
document.getElementById("idea-count").textContent = ideas.length ? " " + ideas.length : "";
renderOpen();
renderView();
</script>
