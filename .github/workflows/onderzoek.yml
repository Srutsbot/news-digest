name: Daily investigative digest

on:
  schedule:
    - cron: "45 6 * * *"  # 08:45 Amsterdam in summer (07:45 in winter)
  workflow_dispatch:

permissions:
  contents: write  # lets the workflow save onderzoek_seen.json back to the repo

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python onderzoek.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Remember which articles were sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onderzoek_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen articles"
            git push
          fi
