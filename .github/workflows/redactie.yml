name: Vroege Dienst page

on:
  schedule:
    - cron: "30 5 * * *"   # 06:30 Amsterdam in winter, 07:30 in summer
    - cron: "30 11 * * *"  # 12:30 Amsterdam in winter, 13:30 in summer
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python redactie.py --out site/index.html --no-snippets  # the page is publicly reachable
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
